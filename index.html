<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>orsa</title>
    <style>
        @font-face {
            font-family: 'Oscine';
            src: url('orsa/Resources/TrialStaticFonts/Oscine_Trial_Rg.ttf') format('truetype');
            font-weight: 400;
            font-style: normal;
        }

        @font-face {
            font-family: 'Oscine';
            src: url('orsa/Resources/TrialStaticFonts/Oscine_Trial_Bd.ttf') format('truetype');
            font-weight: 700;
            font-style: normal;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Oscine', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            min-height: 100vh;
            background: linear-gradient(135deg, 
                rgb(255, 191, 0) 0%,
                rgb(255, 217, 0) 50%,
                rgb(255, 242, 77) 100%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            text-align: center;
            width: 100%;
            max-width: 600px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 40px;
        }

        .app-icon {
            width: 180px;
            height: 180px;
            border-radius: 40px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
        }

        .app-name {
            font-size: 48px;
            font-weight: 700;
            color: #000;
            letter-spacing: -1px;
        }

        .links {
            display: flex;
            gap: 24px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .link-button {
            font-size: 16px;
            color: #000;
            text-decoration: none;
            padding: 12px 24px;
            border: 2px solid #000;
            border-radius: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(10px);
            transition: all 0.2s ease;
        }

        .link-button:hover {
            background: rgba(255, 255, 255, 0.3);
            border-color: #000;
            transform: translateY(-2px);
        }

        @media (max-width: 480px) {
            .app-icon {
                width: 140px;
                height: 140px;
            }

            .app-name {
                font-size: 36px;
            }

            .links {
                flex-direction: column;
                width: 100%;
            }

            .link-button {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <img src="blackorsaflat.png" alt="orsa" class="app-icon" id="app-icon">
        <div class="links">
            <a href="privacy-policy.html" class="link-button">Privacy Policy</a>
            <a href="terms-of-use.html" class="link-button">Terms of Use</a>
        </div>
    </div>
</body>
</html>
